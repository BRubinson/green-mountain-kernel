name: daemon-ci

# The green-suite rule, enforced. CLAUDE.md has always said the daemon's test
# suite "must stay green"; until this workflow existed the entire mitigation was
# a human remembering to run `swift test` before committing — the same gap
# DocsContractTests closed for the hook/launcher manifests.
#
# RUNNER FLOOR IS NOT ARBITRARY: GMCCDaemonKit/AgentIntegration/GmAgentTool.swift
# carries an unconditional `import FoundationModels`, which only exists in the
# macOS 26 SDK. An older image does not fail slowly or partially — the kit does
# not compile at all. If that import ever becomes conditional, this can drop
# back down; until then the floor moves with the SDK.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/gmcc/daemon/**'
      - 'plugins/gmcc/scripts/**'
      - 'plugins/gmcc/hooks/**'
      - 'plugins/gmcc/commands/**'
      - 'plugins/gmcc/skills/**'
      - 'plugins/gmcc/prompts/**'
      - 'plugins/gmcc/.mcp.json'
      - '.github/workflows/daemon-ci.yml'
  pull_request:
    paths:
      - 'plugins/gmcc/**'
      - '.github/workflows/daemon-ci.yml'
  workflow_dispatch:

concurrency:
  group: daemon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Report toolchain
        run: swift --version

      # The doc/manifest contract tests walk plugins/gmcc/{commands,skills,...}
      # and stat the paths hooks.json names, so they need the full checkout, not
      # just the package. They run as part of the suite below.
      - name: Stamp BuildInfo
        run: bash plugins/gmcc/scripts/stamp_build_info.sh plugins/gmcc/daemon

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: plugins/gmcc/daemon/.build
          key: spm-${{ runner.os }}-${{ hashFiles('plugins/gmcc/daemon/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: swift test
        run: swift test --package-path plugins/gmcc/daemon

      # The installer and the hook scripts ship to every install and are never
      # compiled, so the only thing standing between a typo and every session in
      # every booted repo is a syntax check. DocsContractTests runs `bash -n`
      # over scripts/ already; this repeats it standalone so a shell break is
      # legible in the log without reading an XCTest failure.
      - name: bash -n over shipped scripts
        run: |
          for s in plugins/gmcc/scripts/*.sh; do
            bash -n "$s" || { echo "::error file=$s::bash -n failed"; exit 1; }
          done

      - name: Plugin manifests parse
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/gmcc/.claude-plugin/plugin.json \
                   plugins/gmcc/.mcp.json \
                   plugins/gmcc/hooks/hooks.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      # daemon/VERSION is what install_daemon.sh fetches and what
      # check_daemon_stale.sh compares against. A malformed one is not a cosmetic
      # problem: it becomes a release tag and a download URL.
      - name: daemon/VERSION is semver
        run: |
          v="$(cat plugins/gmcc/daemon/VERSION)"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::daemon/VERSION is '$v', expected MAJOR.MINOR.PATCH"; exit 1; }
