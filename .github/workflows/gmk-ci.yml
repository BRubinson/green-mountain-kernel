name: gmk-ci

# The green-suite rule, enforced per MODULE. This replaces daemon-ci.yml, whose
# single job tested one monolithic package; gmk/ is six packages plus an app, and
# a matrix gives each one its own visible green/red check in the PR UI. A break
# now names the module that broke instead of "the suite".
#
# RUNNER FLOOR IS NOT A PREFERENCE: gmAgententicsSdk's GmAgentTool.swift carries
# an unconditional `import FoundationModels`, and the package now also depends on
# the vendored gmClaudeForFoundationModels, whose own floor is macOS 27 (the
# server-side LanguageModel API it implements ships in the 27 SDK). An older
# image does not fail slowly or partially — SwiftPM refuses at GRAPH RESOLUTION,
# before a file is read, and no `@available` gate can reach that far. Every job
# whose graph transitively includes that package inherits the floor, so all of
# them run on one image rather than reasoning about which ones strictly need it.
# The floor moves with the SDK; it was macos-26 until the vendored dependency
# raised it.
#
# THE LABEL IS `xcode-27`, AND THAT IS NOT A TYPO FOR `macos-27`. GitHub ships no
# `macos-27` label at all — the macOS 27 image is published under the Xcode-
# versioned name (`xcode-27`, `xcode-27-xlarge`), arm64 only, GA since
# 2026-09-10. `macos-latest` still resolves to macOS 26, so it is not a shortcut
# here either. Anyone "correcting" this to macos-27 gets an unresolvable label
# and a job that never starts.
#
# OVER-TRIGGERING IS DELIBERATE. A gmVibes-only change also rebuilds gmDaemon.
# The alternative — a hand-maintained path filter per package — is a second copy
# of the dependency graph, and the copy rots silently. Over-triggering wastes
# runner minutes; under-triggering ships a downstream break. Only one of those is
# recoverable by looking at the PR.
#
# THE SCRIPTS ARE NEVER RUN HERE, ONLY SYNTAX-CHECKED. That is a PRESERVED
# invariant, not a new rule: daemon-ci.yml never invoked the installers either.
# rebuild_local.sh and publish_release.sh write to ~/gmfs, tag, and upload release
# assets; neither belongs in a per-PR job, and the packages are built directly
# below, which is the part worth gating. Do not "fix" this by adding a real build.

on:
  push:
    branches: [main]
    paths:
      - 'gmk/**'
      - 'plugins/gmcc/**'
      - '.github/workflows/gmk-ci.yml'
  pull_request:
    paths:
      - 'gmk/**'
      - 'plugins/gmcc/**'
      - '.github/workflows/gmk-ci.yml'
  workflow_dispatch:

concurrency:
  group: gmk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per package, and `mode` is now test for ALL of them.
  #
  # THE COMPILE-ONLY EXCEPTION IS RETIRED. gmAgententicsSdk ran `mode: build`
  # because it was 60 lines of protocol declarations with zero tests, and the
  # prompt that created it forbade fleshing it out — `swift test` on a package
  # whose test target has no tests is a failure, not a pass, which is why the
  # mode lived in the matrix rather than in a conditional. All three of those
  # facts have since changed: the package has a real test target, and
  # daemon-release.yml has been running `swift test` against it in its own loop
  # for a while. The matrix was simply the last place still saying otherwise.
  # `mode` stays in the matrix because it costs nothing and the next package to
  # arrive may genuinely be build-only.
  packages:
    name: ${{ matrix.package }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gmDaemonSdk
            mode: test
          - package: gmDaemon
            mode: test
          - package: gmUxComponentLibrary
            mode: test
          - package: gmMcp
            mode: test
          - package: gmAgententicsSdk
            mode: test
          - package: gmToolchain
            mode: test
          # The GMVibes app's code. It lives in a package rather than in the
          # Xcode target so sourcekit-lsp can resolve it — see the root
          # Package.swift — and getting its own row is what that buys on the CI
          # side: the app's 99 sources are now compiled and unit-tested here,
          # where previously they were only ever built by the gmvibes job.
          - package: gmVibesCore
            mode: test
          # BUILD, not test, and that is deliberate rather than an omission.
          #
          # gmKernel is the multi-call dispatcher: top-level code in an
          # executable target's main.swift, which cannot be imported by a test
          # target at all. Its contract — argv[0] beating argv[1], a bare
          # invocation exiting without opening the database, the entry-point
          # names matching what the release store symlinks — is asserted by
          # MultiCallBinaryContractTests over in gmToolchain, which reads the
          # source as a file. What is left for this row is "does the three-way
          # link still resolve", and that is exactly a build.
          #
          # If gmKernel ever gains a test target, flip this to `test` in the same
          # change — testKernelPackageShipsNoTestTarget fails the build to remind
          # you, so the tests cannot sit there silently never running.
          - package: gmKernel
            mode: build
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Report toolchain
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: gmk/${{ matrix.package }}/.build
          # Package.swift is in the key alongside Package.resolved because
          # three of these packages have NO external dependencies and so no
          # resolved file at all — hashing only the resolved file would give
          # them an empty, shared key.
          key: spm-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles(format('gmk/{0}/Package.resolved', matrix.package), format('gmk/{0}/Package.swift', matrix.package)) }}
          restore-keys: spm-${{ matrix.package }}-${{ runner.os }}-

      # No BuildInfo stamp step: the SwiftPM PREBUILD PLUGIN in gmDaemon does
      # the stamping inside the build graph, so every job here and every Xcode
      # build get it for free. A clean clone now compiles with no prior shell
      # step, which was not true before.
      - name: swift ${{ matrix.mode }}
        run: swift ${{ matrix.mode }} --package-path gmk/${{ matrix.package }}

  # gmVibes has NEVER been built in CI. It is built here for the first time.
  #
  # CODE_SIGNING_ALLOWED=NO is load-bearing: signing is split on purpose — the
  # app target is CODE_SIGN_STYLE = Manual with DEVELOPMENT_TEAM = 4VL4UGNPQQ,
  # the test targets are Automatic — and a build-only job must not require the
  # Developer ID cert to be present on the runner. Release signing stays on the
  # existing release-dmg path, which is where a real identity belongs.
  # This job's graph does NOT include gmAgententicsSdk — gmVibes depends on
  # gmUxComponentLibrary, gmMcp and gmDaemonSdk, and nothing in the repo depends
  # on the agentics package. It is moved to the same image anyway, so the repo
  # has ONE runner story rather than two that have to be kept straight; a lower
  # floor builds fine on a higher SDK.
  gmvibes:
    name: gmVibes (xcodebuild)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # The schemes are SHARED and committed under
      # gmk/gmk.xcodeproj/xcshareddata/xcschemes/. Before that they lived in
      # gitignored xcuserdata/, so a clean runner had nothing to build by name
      # and this job could not exist. Listing first makes a missing scheme a
      # legible failure instead of an obscure xcodebuild error.
      - name: xcodebuild -list
        run: xcodebuild -list -project gmk/gmk.xcodeproj

      # No log prettifier in the pipeline: a pipe would hand the job the
      # formatter's exit status instead of xcodebuild's, and a build that failed
      # while the job passed is the one outcome a first-time CI job must not
      # produce. `-quiet` gets the noise down without changing who reports.
      - name: Build gmVibes
        run: |
          xcodebuild build -quiet \
            -project gmk/gmk.xcodeproj \
            -scheme GMVibes \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

  # Everything that is not a Swift package: the shipped shell scripts, the
  # plugin manifests, and the version pin. Cheap, and it catches the class of
  # break that reaches every session in every booted repo.
  # This job touches no Swift at all — `bash -n` and JSON parsing — so it needs
  # no platform floor whatsoever. It moves with the others only so the repo has
  # ONE runner label to reason about; if xcode-27 capacity ever makes this job
  # queue, dropping it back is safe and affects nothing else.
  contracts:
    name: scripts + manifests
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The shipped scripts are never compiled, so the only thing standing
      # between a typo and every session in every booted repo is a syntax check.
      # Both trees are checked: the FROZEN live plugin scripts, which still run
      # this machine, and the new gmk/ scripts, which are written but not yet
      # exercised anywhere.
      - name: bash -n over shipped scripts
        run: |
          for s in plugins/gmcc/scripts/*.sh gmk/scripts/*.sh; do
            [ -e "$s" ] || continue
            bash -n "$s" || { echo "::error file=$s::bash -n failed"; exit 1; }
          done

      - name: Plugin manifests parse
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/gmcc/.claude-plugin/plugin.json \
                   plugins/gmcc/.mcp.json \
                   plugins/gmcc/hooks/hooks.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      # gmk/VERSION is what install_gm.sh fetches. A malformed one is not a
      # cosmetic problem: it becomes a release tag and a download URL.
      - name: gmk/VERSION is semver
        run: |
          v="$(cat gmk/VERSION)"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::gmk/VERSION is '$v', expected MAJOR.MINOR.PATCH"; exit 1; }
