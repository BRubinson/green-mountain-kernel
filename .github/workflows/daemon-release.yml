name: daemon-release

# Builds the universal `gm_kernel` binary once and
# attaches them to a `gm_kernel-v<version>` release. The plugin's install_gm.sh
# fetches exactly this asset.
#
#
# THE BINARIES NOW COME FROM THREE PACKAGES, not one:
#   gm_kernel <- gmk/gmKernel, which links GmKernelHost (gmDaemon),
#   GmMcpServer (gmMcp) and GmHookCli (gmDaemonSdk) into ONE Mach-O.
# gm_hook's personality ships from the base SDK deliberately: it links the SDK alone, so
# bundling it with the persistence layer would drag GRDB into a client that
# never opens the database.
#
# TAG NAMESPACE: `gm_kernel-v*`, the ONE release namespace. It replaced a pair of
# independently versioned tracks (`daemon-v*` here, `gmvibes-v*` for the app),
# which had no recorded relationship to each other even though the app and the
# daemon speak a versioned wire protocol.
#
# ── THIS FALLBACK PUBLISHES BINARIES ONLY ───────────────────────────────────
#
# A full release also carries `GMVibes-<version>.dmg`, and this workflow does not
# build it. That is a deliberate limit, not a gap: a release DMG must be signed
# with a Developer ID and notarized, which needs a certificate and an Apple ID in
# the runner's keychain. An unsigned DMG attached here would be REFUSED by
# Gatekeeper on every machine that downloaded it — the exact outcome
# publish_release.sh now blocks by default.
#
# So a release cut here is missing its app, and install_gm.sh handles that the
# same way it handles a legacy release: binaries install, the app step is
# skipped. Cut the app from a Mac with the signing identity.
#
# THE BINARY VERSION IS DECOUPLED FROM THE PLUGIN VERSION ON PURPOSE. The plugin
# is ~300KB of markdown that changes constantly; the Swift is 44k lines that does
# not. Coupling them would make every prompt-wording tweak force every install to
# re-download ~15MB of unchanged binaries. gmk/VERSION moves only when the code
# behind it does.
#
# ── THIS IS THE FALLBACK PATH, NOT THE DEFAULT ONE ──────────────────────────
#
# The default way to cut a release is LOCAL:
#
#     bash gmk/scripts/rebuild_local.sh      # universal build, staged as -BETA
#     bash gmk/scripts/publish_release.sh    # verify, tag, upload what you tested
#
# That exists so the published bytes are the bytes that were actually run on a
# real machine, rather than a fresh build nobody has executed.
#
# THE TAG TRIGGER IS DELIBERATELY ABSENT. It used to be `on: push: tags`, and
# leaving it that way would make this workflow fire on the tag publish_release.sh
# pushes, rebuild from scratch, and `--clobber` the verified assets that were
# just uploaded — silently replacing the tested artifact with an untested one.
# The two publishers cannot both own the same tag, so this one is manual.
#
# Dispatch it when the local path is unavailable: no Mac at hand, a toolchain
# that will not build, or to reproduce an existing release from a clean checkout.
# It will clobber the assets on the tag it is given, which is the point when you
# are reaching for it on purpose.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must equal gmk/VERSION)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # `xcode-27`, NOT `macos-27` — GitHub publishes no such label; the macOS 27
    # image ships under the Xcode-versioned name (arm64 only, GA 2026-09-10).
    # See the runner note in gmk-ci.yml for the full reasoning.
    #
    # THIS JOB NEEDS THE 27 FLOOR FOR ITS TEST LOOP, NOT ITS BUILD. The universal
    # build below covers gmDaemonSdk / gmDaemon / gmMcp, none of which reach
    # gmAgententicsSdk — but the "never ship what was not tested" loop runs
    # `swift test` against gmAgententicsSdk, and that package's graph now
    # includes the vendored gmClaudeForFoundationModels at macOS 27. Dropping
    # this back to macos-26 fails at graph resolution in the test step, long
    # after the job has looked healthy.
    #
    # The arm64-only restriction costs nothing here: macos-26 was arm64 too, and
    # the universal step cross-compiles x86_64 through SwiftPM's `--arch` flags
    # rather than needing an Intel host.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # The tag and the file must agree. They are two statements of the same
      # fact, and if they disagree the asset name encodes one version while the
      # installer asks for the other — a 404 that looks like a network problem.
      - name: Resolve and verify version
        id: v
        run: |
          pinned="$(cat gmk/VERSION)"
          # workflow_dispatch is the only trigger now, so the version always
          # arrives as an input; there is no tag ref to derive it from.
          asked="${{ inputs.version }}"
          if [ "$pinned" != "$asked" ]; then
            echo "::error::gmk/VERSION is '$pinned' but the release asks for '$asked' — bump the file and the tag together"
            exit 1
          fi
          echo "version=$pinned" >> "$GITHUB_OUTPUT"
          echo "tag=gm_kernel-v$pinned" >> "$GITHUB_OUTPUT"
          echo "asset=gm-daemon-$pinned-macos-universal.tar.gz" >> "$GITHUB_OUTPUT"

      # NO BuildInfo stamp step. The SwiftPM prebuild plugin in gmDaemon stamps
      # the build identity inside the build graph, so CI and a developer's Xcode
      # produce the same shape with nothing to keep in sync — which is exactly
      # why the shell step could be deleted rather than ported.

      # Never ship what was not tested. Same suites gmk-ci runs; running them
      # again here means a release can be cut from a tag without trusting that
      # CI happened to pass on that commit.
      - name: swift test
        run: |
          set -euo pipefail
          # ONE package. The loop that used to be here named six targets that no
          # longer exist, and `swift test` on a package with no test target
          # SUCCEEDS — so a stale list would have passed this gate having run
          # nothing, on the release path.
          swift build --package-path gmk/gmKernel
          GM_TEST_KERNEL_BIN="$PWD/gmk/gmKernel/.build/debug/gm_kernel" \
            swift test --package-path gmk/Gm_Kernel_test 2>&1 | tee test.log
          n="$(grep -cE "' passed \(" test.log || true)"
          echo "$n cases passed"
          [ "${n:-0}" -gt 0 ] || { echo "::error::the suite ran ZERO cases"; exit 1; }

      # SwiftPM emits a genuinely universal Mach-O when handed both --arch flags
      # (no lipo step); the verification below is what makes that a fact rather
      # than an assumption.
      #
      # THREE PACKAGES, THREE BINARIES. Each is built and then staged from its
      # OWN bin path — the three no longer share one. Staging from a single
      # directory would silently ship whatever stale copy happened to be there.
      - name: Build universal (arm64 + x86_64)
        run: |
          set -euo pipefail
          # gmKernel alone pulls the other three transitively: it links
          # GmKernelHost, GmMcpServer and GmHookCli, so building it builds them.
          for p in gmKernel; do
            swift build -c release --package-path "gmk/$p" --arch arm64 --arch x86_64
          done

      - name: Stage, strip, sign
        id: stage
        run: |
          set -euo pipefail
          bin_path() {
            swift build -c release --package-path "gmk/$1" \
              --arch arm64 --arch x86_64 --show-bin-path
          }
          KERNEL_BIN="$(bin_path gmKernel)"
          mkdir -p dist
          # ONE Mach-O. The three personalities are library targets now and
          # gmKernel links them into a single binary; the entry-point names
          # become symlinks at activation, not staged files.
          cp "$KERNEL_BIN/gm_kernel" dist/gm_kernel
          for b in gm_kernel; do
            # -S drops debug symbols only; the binaries keep their exported
            # symbols and stay fully functional. Measured on this package:
            # 55MB -> 45MB raw, 15MB -> 12MB compressed, per architecture.
            strip -S "dist/$b"
            # Ad-hoc signature. arm64 refuses to exec an unsigned Mach-O at all,
            # and curl (unlike a browser) does not set com.apple.quarantine, so
            # ad-hoc is sufficient for a CLI installed this way. Notarization
            # would only matter if these were ever delivered through Gatekeeper's
            # quarantine path, which they are not.
            codesign --force --sign - --timestamp=none "dist/$b"
            lipo -info "dist/$b"
            # Fail loudly rather than shipping a single-arch asset named
            # "universal" — an Intel user would download it and get "bad CPU
            # type", which reads as a corrupt download, not a build mistake.
            lipo -info "dist/$b" | grep -q 'arm64' \
              || { echo "::error::$b is missing arm64"; exit 1; }
            lipo -info "dist/$b" | grep -q 'x86_64' \
              || { echo "::error::$b is missing x86_64"; exit 1; }
            codesign --verify --strict "dist/$b" \
              || { echo "::error::$b failed signature verification"; exit 1; }
          done

      - name: Package + checksum
        run: |
          set -euo pipefail
          cd dist
          # Flat archive: install_gm.sh extracts into a temp dir and expects the
          # three binaries at the root, with no version directory to guess.
          tar -czf "../${{ steps.v.outputs.asset }}" gm_kernel
          cd ..
          shasum -a 256 "${{ steps.v.outputs.asset }}" > "${{ steps.v.outputs.asset }}.sha256"
          cat "${{ steps.v.outputs.asset }}.sha256"
          ls -lh "${{ steps.v.outputs.asset }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          # Notes go through a file, not an inline --notes string: markdown with
          # fenced code blocks has to start lines at column 0, and a column-0
          # line inside a YAML block scalar ends the scalar.
          cat > release-notes.md <<'NOTES'
          Universal (arm64 + x86_64) macOS binary `gm_kernel` — one Mach-O that
          answers as `gm_daemon`, `gm_mcp` and `gm_hook` through argv[0], with the
          installer creating those entry-point symlinks in `~/gmfs/bin`.

          Installed by the plugin's `install_gm.sh`, which fetches the newest
          `gm_kernel-v*` release and verifies the SHA-256 sidecar before unpacking.

          Manual install:

              bash plugins/gmcc/scripts/install_gm.sh
          NOTES
          # The heredoc body carries this file's YAML indentation; strip it back off.
          sed -i '' 's/^          //' release-notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "GM kernel v${{ steps.v.outputs.version }} (binaries only)" \
              --notes-file release-notes.md
          fi
          gh release upload "$TAG" \
            "${{ steps.v.outputs.asset }}" \
            "${{ steps.v.outputs.asset }}.sha256" \
            --clobber
