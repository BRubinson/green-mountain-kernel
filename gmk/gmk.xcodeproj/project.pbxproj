			name = "Install gm_kernel executable";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -eu\n# Make the package-built gm_kernel the bundle's executable. Xcode builds the\n# product through this target's dependency; the copy lands before code signing,\n# so the signed executable is the kernel. A build that leaves Xcode's own stub\n# in place would ship an app that is not the kernel, hence the hard checks.\nSRC=\"${BUILT_PRODUCTS_DIR}/gm_kernel\"\n[ -x \"$SRC\" ] || { echo \"error: Xcode did not build the gm_kernel package product at $SRC\" >&2; exit 1; }\nDEST=\"${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}\"\ncp -p \"$SRC\" \"$DEST\"\n\"$DEST\" --version | grep -q \"gm_kernel protocol\" || { echo \"error: $DEST does not answer as gm_kernel\" >&2; exit 1; }\necho \"installed gm_kernel ($(lipo -archs \"$DEST\")) as the bundle executable\"\n";
		};
		1B4010F12FDCA09300DAF751 /* Generate plugins/gmcc */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Generate plugins/gmcc";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -euo pipefail\n# Regenerate plugins/gmcc from the bridge values in gmAgententicsSdk.\n#\n# IT CALLS generate_plugin.sh AND REIMPLEMENTS NOTHING. rebuild_local.sh:331\n# already calls the same script; a second implementation of the generation\n# logic is the next gm_releases.sh-exists-twice, which CLAUDE.md records as\n# having been believed FIXED for two versions before anyone caught it. The\n# script re-derives the repo root itself, so it needs no argument.\n#\n# `set -euo pipefail` IS MANDATORY. The `Embed gm_kernel CLI` phase's own\n# comment records the same fact: without it a failed step leaves the phase\n# GREEN.\n#\n# FAILURE POLICY: A REAL GENERATION FAILURE FAILS THE BUILD. No `|| true`, no\n# fallback. A green build over a stale plugin is exactly the silent-wrong this\n# target exists to prevent. Only the three gates exit 0, and each prints a\n# `note:` saying which one fired.\n#\n# NO PBXTargetDependency EXISTS IN EITHER DIRECTION, and that is deliberate.\n# Parallelism is bought by INDEPENDENCE, not by a setting:\n# BuildIndependentTargetsInParallel = 1 buys nothing unless the two targets are\n# genuinely independent. A dependency edge silently serialises the build.\n\n# GATE 1 - configuration. Inside the script, not only in the scheme: a\n# build-setting gate is bypassed by anyone who builds the target directly or\n# drags it into another scheme. This is what keeps a source-tree write off the\n# Release path that publish_release.sh requires clean.\n[ \"${CONFIGURATION:-}\" = \"Beta\" ] || { echo \"note: plugin generation is Beta-only (CONFIGURATION=${CONFIGURATION:-})\"; exit 0; }\n\n# GATE 2 - CONFLICTED INDEX. NOT hypothetical: the tree has unmerged paths\n# RIGHT NOW. Regenerating into unresolved conflicts writes generated bytes over\n# a half-resolved state, and gm_bridge_writer's stage-and-swap will do it\n# happily: its ONLY target check is that .claude-plugin/plugin.json exists,\n# which a conflicted tree satisfies, and the half-resolved tree it renames into\n# a trash directory is then dropped with `try? removeItem` - no prompt, no\n# backup. plugins/gmcc is itself a COMMITTED, conflictable tree, so that is\n# reachable rather than theoretical.\n#\n# ls-files -u RATHER THAN MERGE_HEAD: MERGE_HEAD exists ONLY during `git\n# merge`. A conflicted rebase, cherry-pick, revert or `stash pop` walks\n# straight through that test. An unmerged INDEX ENTRY is what all five leave\n# behind, so this one test catches every conflicted state.\nif [ -n \"$(git -C \"${SRCROOT}/..\" ls-files -u)\" ]; then\n  echo \"note: tree has unmerged paths - skipping plugin generation\"; exit 0\nfi\n\n# GATE 3 - target sanity. gm_bridge_writer already refuses a target with no\n# manifest; restating it here makes the failure land at the phase with a\n# readable message instead of deep inside Swift. Sandboxing off buys the\n# ability to write anywhere; these three lines say where.\n[ -f \"${SRCROOT}/../plugins/gmcc/.claude-plugin/plugin.json\" ] || { echo \"error: no plugin manifest at plugins/gmcc\"; exit 1; }\n\n# STRIP THE INHERITED BUILD ENVIRONMENT.\n# The macOS 27 objection was killed with dependency-edge reasoning, which says\n# NOTHING about the ENVIRONMENT. xcodebuild exports MACOSX_DEPLOYMENT_TARGET,\n# SDKROOT, TOOLCHAINS and DEVELOPER_DIR into this phase; SwiftPM reads several\n# of them; and gmAgententicsSdk floors at 27 with unsafeFlags. A nested build\n# inheriting a 26.0 deployment target may fail to resolve a package requiring\n# 27 - the same symptom, arriving through a door the refutation did not cover.\n# Cheap to defend, so defended here rather than offered as a remedy after.\nenv -u SDKROOT -u MACOSX_DEPLOYMENT_TARGET -u TOOLCHAINS -u DEVELOPER_DIR \\\n    bash \"${SRCROOT}/scripts/generate_plugin.sh\"\n\n# VALIDATE WHAT WAS EMITTED.\n# CLAUDE.md records that the writer's verify() checks a file RENDERED, never\n# that it is VALID - the gap v54.0.0's `outputStyles` key fell through, taking\n# the ENTIRE plugin down (an unknown key in plugin.json makes Claude Code\n# refuse to load any of it). The current remedy is \"eyeball the emitted\n# plugin.json\". There is a machine check and it is free.\n# PLAIN, not --strict: --strict fails TODAY on one warning (the manifest\n# declares no `author`), and adding that bridge field is a separate decision.\n# Guarded on the binary, so the build does not fail where claude is not on the\n# phase's PATH - and LOUD when it skips, because a silent skip logs identically\n# to a pass.\n#\n# FIND THE BINARY RATHER THAN HOPING. A GUI-launched Xcode inherits launchd's\n# PATH - /usr/bin:/bin:/usr/sbin:/sbin, since `launchctl getenv PATH` is empty -\n# while claude lives at /opt/homebrew/bin, which reaches a shell only through\n# ~/.zprofile. So `xcodebuild` typed in a terminal finds it (how this was\n# tested) and Cmd-R in Xcode.app does not (how it will be used). swift, git and\n# python3 are all under /usr/bin and are unaffected; claude is the only tool\n# here that is not on the launchd default PATH.\n#\n# A FAILING `claude plugin validate` STILL FAILS THE BUILD: inside an `if` BODY\n# a failing command is not exempt from `set -e`, so the shell exits non-zero.\nPATH=\"/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$HOME/.claude/local:$PATH\"\nif command -v claude >/dev/null 2>&1; then\n  claude plugin validate \"${SRCROOT}/../plugins/gmcc\"\nelse\n  echo \"note: claude not on this phase's PATH - plugin.json was NOT validated\"\nfi\n";
		};
